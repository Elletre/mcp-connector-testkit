[project]
name = "acme-mail-demo"
version = "0.1.0"
description = "Demo target for mcpqa: a fake mail provider API and an MCP connector in front of it, with a catalogue of seeded defects."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Evgenii Miatlev" }]
dependencies = [
    "httpx2>=2.13.0",
    "mcp>=2.2.0",
    "pydantic>=2.12.0",
    "starlette>=1.0.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
acme-mail-api = "acme_mail_api.__main__:main"
acme-mail-mcp = "acme_mail_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acme_mail_api", "src/acme_mail_mcp"]
